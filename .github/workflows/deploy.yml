name: Production Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (use with caution)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      services:
        description: "Services to deploy"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "control-plane"
          - "data-retrieval"

env:
  CONTROL_PLANE_IMAGE: hdbdocker/trawling-traders-control-plane:latest
  CONTROL_PLANE_IMAGE_SHA: hdbdocker/trawling-traders-control-plane:${{ github.sha }}
  DATA_RETRIEVAL_IMAGE: hdbdocker/trawling-traders-data-retrieval:latest
  DATA_RETRIEVAL_IMAGE_SHA: hdbdocker/trawling-traders-data-retrieval:${{ github.sha }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      control_plane_changed: ${{ steps.changes.outputs.control_plane }}
      data_retrieval_changed: ${{ steps.changes.outputs.data_retrieval }}
      deploy_all: ${{ github.event.inputs.services == 'all' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          # Use github.event.before for correct merge commit handling
          # (HEAD~1 only checks the last commit, missing squashed changes)
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          if git diff --name-only "$BASE" HEAD | grep -q "^services/control-plane/"; then
            echo "control_plane=true" >> $GITHUB_OUTPUT
          else
            echo "control_plane=false" >> $GITHUB_OUTPUT
          fi
          if git diff --name-only "$BASE" HEAD | grep -q "^services/data-retrieval/"; then
            echo "data_retrieval=true" >> $GITHUB_OUTPUT
          else
            echo "data_retrieval=false" >> $GITHUB_OUTPUT
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a  # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/control-plane/target/
            services/data-retrieval/target/
            services/bot-runner/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (control-plane)
        working-directory: services/control-plane
        run: cargo fmt --check

      - name: Check formatting (data-retrieval)
        working-directory: services/data-retrieval
        run: cargo fmt --check

      - name: Check formatting (bot-runner)
        working-directory: services/bot-runner
        run: cargo fmt --check

      - name: Run Clippy (control-plane)
        working-directory: services/control-plane
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy (data-retrieval)
        working-directory: services/data-retrieval
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy (bot-runner)
        working-directory: services/bot-runner
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (control-plane)
        working-directory: services/control-plane
        run: cargo test --release

      - name: Run tests (data-retrieval)
        working-directory: services/data-retrieval
        run: cargo test --release

      - name: Run tests (bot-runner)
        working-directory: services/bot-runner
        run: cargo test --release

  build-control-plane:
    needs: [check-changes, lint-and-test]
    # always() is required so this job runs even when lint-and-test is skipped
    # (skip_tests=true). The next line ensures we only proceed when tests
    # passed or were intentionally skipped — never on failure.
    if: |
      always() &&
      (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped') &&
      (needs.check-changes.outputs.deploy_all == 'true' ||
       needs.check-changes.outputs.control_plane_changed == 'true' ||
       github.event.inputs.services == 'control-plane')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # v3.8.0

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0d442ad30e3aa25137957afdf208bbe64e8  # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push control-plane
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v5.4.0
        with:
          context: .
          file: ./services/control-plane/Dockerfile
          push: true
          tags: |
            ${{ env.CONTROL_PLANE_IMAGE }}
            ${{ env.CONTROL_PLANE_IMAGE_SHA }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

  build-data-retrieval:
    needs: [check-changes, lint-and-test]
    # always() is required so this job runs even when lint-and-test is skipped
    # (skip_tests=true). The next line ensures we only proceed when tests
    # passed or were intentionally skipped — never on failure.
    if: |
      always() &&
      (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped') &&
      (needs.check-changes.outputs.deploy_all == 'true' ||
       needs.check-changes.outputs.data_retrieval_changed == 'true' ||
       github.event.inputs.services == 'data-retrieval')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # v3.8.0

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0d442ad30e3aa25137957afdf208bbe64e8  # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push data-retrieval
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v5.4.0
        with:
          context: .
          file: ./services/data-retrieval/Dockerfile
          push: true
          tags: |
            ${{ env.DATA_RETRIEVAL_IMAGE }}
            ${{ env.DATA_RETRIEVAL_IMAGE_SHA }}
          cache-from: type=gha,scope=data-retrieval
          cache-to: type=gha,mode=max,scope=data-retrieval

  deploy:
    needs: [check-changes, build-control-plane, build-data-retrieval]
    # always() is required because build jobs may be skipped when their
    # service had no changes. The conditions ensure at least one build
    # succeeded and no build failed.
    if: |
      always() &&
      (needs.build-control-plane.result == 'success' || needs.build-control-plane.result == 'skipped') &&
      (needs.build-data-retrieval.result == 'success' || needs.build-data-retrieval.result == 'skipped') &&
      (needs.build-control-plane.result == 'success' || needs.build-data-retrieval.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f89dfc8b884c8  # v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            echo "=== Trawling Traders Deployment ==="

            # Login to Docker Hub (--password-stdin avoids credential in process listing)
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # Create Docker network if it doesn't exist
            docker network create trawling-traders-network 2>/dev/null || true

            # Ensure PostgreSQL is on the network
            docker network connect trawling-traders-network trawling-traders-db 2>/dev/null || true

            # Deploy data-retrieval only if its build job succeeded
            if [[ "${{ needs.build-data-retrieval.result }}" == "success" ]] && docker pull ${{ env.DATA_RETRIEVAL_IMAGE }} 2>/dev/null; then
              echo "Deploying data-retrieval..."
              docker stop trawling-traders-data-retrieval 2>/dev/null || true
              docker rm trawling-traders-data-retrieval 2>/dev/null || true

              docker run -d --restart unless-stopped \
                --name trawling-traders-data-retrieval \
                --network trawling-traders-network \
                -p 127.0.0.1:8081:8080 \
                --env ENVIRONMENT="${{ secrets.ENVIRONMENT }}" \
                --env PORT=8080 \
                ${{ env.DATA_RETRIEVAL_IMAGE }}

              echo "data-retrieval deployed successfully"
            fi

            # Deploy control-plane only if its build job succeeded
            if [[ "${{ needs.build-control-plane.result }}" == "success" ]] && docker pull ${{ env.CONTROL_PLANE_IMAGE }} 2>/dev/null; then
              echo "Deploying control-plane..."
              docker stop trawling-traders-control-plane 2>/dev/null || true
              docker rm trawling-traders-control-plane 2>/dev/null || true

              # Only 3 true secrets as ENV - everything else is in platform_config DB table
              # Stripe config is managed via cedros-pay admin at /v1/pay/admin/config
              # Write secrets to a temp env file so they are not visible in `docker inspect`
              CP_ENV_FILE="$(mktemp)"
              printf 'DATABASE_URL=%s\nJWT_SECRET=%s\nSECRETS_ENCRYPTION_KEY=%s\n' \
                '${{ secrets.DATABASE_URL }}' \
                '${{ secrets.JWT_SECRET }}' \
                '${{ secrets.SECRETS_ENCRYPTION_KEY }}' \
                > "$CP_ENV_FILE"

              docker run -d --restart unless-stopped \
                --name trawling-traders-control-plane \
                --network trawling-traders-network \
                -p 127.0.0.1:3001:3000 \
                --env PORT=3000 \
                --env-file "$CP_ENV_FILE" \
                ${{ env.CONTROL_PLANE_IMAGE }}

              rm -f "$CP_ENV_FILE"
              echo "control-plane deployed successfully"
            fi

            # Show running containers
            echo ""
            echo "=== Running Trawling Traders containers ==="
            docker ps --filter "name=trawling-traders" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            # Health check — verify containers are running AND responding to HTTP
            echo ""
            echo "=== Health Checks ==="
            sleep 10

            if docker ps --filter "name=trawling-traders-control-plane" --filter "status=running" -q | grep -q .; then
              if curl -sf --max-time 5 http://127.0.0.1:3001/v1/healthz > /dev/null 2>&1; then
                echo "control-plane: Healthy (HTTP 200)"
              else
                echo "control-plane: WARNING - container running but HTTP health check failed"
                docker logs --tail 20 trawling-traders-control-plane
              fi
            else
              echo "control-plane: FAILED - check logs with: docker logs trawling-traders-control-plane"
            fi

            if docker ps --filter "name=trawling-traders-data-retrieval" --filter "status=running" -q | grep -q .; then
              if curl -sf --max-time 5 http://127.0.0.1:8081/health > /dev/null 2>&1; then
                echo "data-retrieval: Healthy (HTTP 200)"
              else
                echo "data-retrieval: WARNING - container running but HTTP health check failed"
                docker logs --tail 20 trawling-traders-data-retrieval
              fi
            else
              echo "data-retrieval: FAILED - check logs with: docker logs trawling-traders-data-retrieval"
            fi

  deployment-notification:
    needs: [deploy]
    # always() ensures notification is sent regardless of deploy outcome
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Deployment Status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "Services deployed to ${{ secrets.SERVER_HOST }}"
          else
            echo "❌ DEPLOYMENT FAILED - Check logs for details"
            exit 1
          fi
